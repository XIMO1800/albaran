<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos Tienda</title>
<meta name="theme-color" content="#862133">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Misma línea que Recogida y TraceQueso: granate El Hidalgo, dorado, Barlow. Tema claro único (se usa en tienda y fábrica). */
:root{
  color-scheme:light;
  --brand:#862133; --brand-deep:#6a1010; --brand-soft:#f7e8eb; --gold:#c4952b; --gold-soft:#fbf1dc;
  --bg:#f2efee; --card:#ffffff; --surface2:#f7f4f3; --fg:#1d1618; --muted:#6a5f61; --line:#ddd4d5;
  --accent:var(--brand); --accent-fg:#fff; --soft:var(--brand-soft);
  /* colores de tarjetón, como en TraceQueso */
  --mezcla:#1e5e3a; --oveja:#1d3a7a; --do:#e0620b; --cabra:#b8a271; --averia:#c0262d; --otros:#6a5f61;
  --danger:#c0262d; --ok:#1e7443; --warn:#9c5c00;
  --mezcla-t:#e3efe7; --oveja-t:#e4e9f5; --do-t:#fdeedd; --cabra-t:#f6f0e1; --averia-t:#fbe4e4; --otros-t:#eeeae8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:16px/1.4 var(--font);padding:0 0 110px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding:12px 16px;max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 0 var(--brand-deep)}
.top-in{max-width:760px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;padding-block:8px 6px;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{display:flex;align-items:center;background:#fff;border-radius:8px;padding:3px 8px;flex:none}
.logo img{height:32px;width:auto;display:block}
.app-name{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.who{margin-left:auto;font-size:12px;text-align:right;line-height:1.3}
.who b{font-weight:700}
.who button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:2px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;font-weight:700;font-size:15px;color:rgba(255,255,255,.75);white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#2b1d00;font-size:12px;font-weight:700;text-align:center;margin-left:5px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 0 var(--brand-deep)}
.btn.pri:active{transform:translateY(1px);box-shadow:none}
.btn.del{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ped{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;cursor:pointer}
.ped b{font-family:var(--display);font-size:21px;font-weight:700}
.ped .meta{grid-column:2/4;color:var(--muted);font-size:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.e-ENVIADO{background:var(--gold-soft);color:#7a4a00}.e-PREPARANDO{background:#e1ecf9;color:#1d5796}
.e-PREPARADO{background:#e1f2e7;color:#1e7443}.e-ALBARANADO{background:#ebe6e7;color:#4a4042}.e-ANULADO{background:#fde4e4;color:#b3262d}
.sec{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);font-weight:700}
label.l{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-weight:700}
input,select,textarea{width:100%;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:17px}
textarea{min-height:64px;resize:vertical}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.vacio{color:var(--muted);text-align:center;padding:24px 8px}
.grupo{margin:18px 0 8px;padding:7px 12px;border-radius:10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#fff;background:#5a4e50}
.s-X{background:#5a4e50}.s-M{background:var(--mezcla)}.s-O{background:var(--oveja)}.s-D{background:var(--do)}.s-C{background:var(--cabra);color:#3d2f10}.s-P{background:var(--gold);color:#2b1d00}.s-V{background:var(--averia)}
.prod{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--t,var(--card));border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:9px 10px;margin-bottom:6px}
.prod.has{box-shadow:inset 0 0 0 2px var(--c)}
.prod .pn b{display:block;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.prod .pn span{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;cursor:pointer;color:var(--brand)}
.step input{width:58px;text-align:center;padding:8px 4px;font-family:var(--display);font-size:22px;font-weight:700}
.band{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.band button{border:1.5px solid var(--gold);background:var(--gold-soft);color:#6b4500;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer}
.lin{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.lin:first-child{border-top:0}
.lin .ln{font-weight:700}
.lin .ln small{font-weight:400;color:var(--muted)}
.lin .lt{font-family:var(--display);font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.lin .lf{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:end}
.lin.ok .ln::after{content:" ✓";color:var(--ok)}
.chk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--muted)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.x{border:0;background:none;color:var(--danger);font-size:24px;padding:6px 8px;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--c)}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:3px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.barra .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tot small{display:block;font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted)}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:20;background:#1d1618;color:#fff;padding:11px 16px;border-radius:12px;max-width:90vw;font-weight:600}
.toast.err{background:var(--danger)}
.aviso{background:var(--gold-soft);color:#5a3a00;border:1px solid #ecd59f;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.obsbox{background:var(--brand-soft);border-left:5px solid var(--brand);border-radius:10px;padding:10px 12px;margin-bottom:10px;white-space:pre-wrap}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,96vw);max-height:88vh;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(29,22,24,.5)}
.dh{position:sticky;top:0;background:var(--brand);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh .btn{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.db{padding:12px 14px 16px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pick button{border:1px solid var(--line);border-left:8px solid var(--c);background:var(--t,var(--card));border-radius:10px;padding:8px;text-align:left;cursor:pointer}
.pick button b{display:block;font-family:var(--display);font-size:18px}.pick button span{font-size:13px;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 1.4fr;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.prow .r2{grid-column:1/-1;display:grid;grid-template-columns:1fr 5.5em 4.5em auto auto;gap:6px;align-items:center}
.prow input,.prow select{padding:7px 8px;font-size:15px}
.mini{font-size:11px;color:var(--muted);text-align:center}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;background:var(--brand);color:#fff;text-align:center}
.login .logo{padding:8px 16px;border-radius:12px;margin-bottom:14px}
.login .logo img{height:56px}
.login h1{font-family:var(--display);font-size:30px;margin:0;letter-spacing:.02em}
.login .sub{color:rgba(255,255,255,.8);font-size:14px}
.login form,.login .cfg{width:100%;max-width:320px}
.login input{text-align:center;font-family:var(--display);font-size:34px;letter-spacing:.3em;margin:18px 0 12px;border:0}
.login .btn{width:100%;background:var(--gold);color:#2b1d00;border:0;box-shadow:0 2px 0 #8d6a1d;font-size:18px}
.selbox{width:24px;height:24px;accent-color:var(--brand)}
/* artículos y precios (móvil) */
.pcard{background:var(--t,var(--card));border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.pcard.off{opacity:.55}
.pc1{display:grid;grid-template-columns:9.5em 1fr;gap:6px}
.pcode{font-family:var(--display);font-weight:700!important;font-size:18px!important;text-transform:uppercase}
.pc2{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:6px;align-items:end}
.pc2 label,.lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;gap:2px}
.pc3{display:flex;gap:6px;align-items:center}
.pc3 .x{margin-left:auto}
.mvb{width:40px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;color:var(--brand)}
.mvb:disabled{opacity:.3}
.tog{border-radius:99px;padding:6px 12px;font-weight:700;border:1.5px solid var(--ok);background:#e1f2e7;color:var(--ok);cursor:pointer;font-size:14px}
.tog.off{border-color:var(--line);background:#fff;color:var(--muted)}
/* escritorio */
body.desk .wrap,body.desk .top-in,body.desk .barra .in{max-width:1280px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:140px;min-width:0}
.khead{font-weight:700;color:var(--brand);text-transform:uppercase;font-size:13px;letter-spacing:.06em;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kgrid .card{margin:0}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filtros input,.filtros select{width:auto;font-size:15px;padding:7px 9px}
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--brand);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
table.t td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
table.t .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover td{background:var(--brand-soft)}
table.t tr.det>td{background:var(--surface2);padding:12px 16px}
table.t tr.dif td{background:#fdf0d8}
table.t tr.pr td{background:var(--t)}
table.t tr.pr td:first-child{border-left:8px solid var(--c)}
table.t input,table.t select{padding:6px 8px;font-size:14px}
table.t tfoot td{font-weight:700;background:var(--surface2)}
table.t.sub{background:#fff;border:1px solid var(--line)}
table.t.sub th{background:#ebe6e7;color:var(--fg)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:120px}
.kpi b{display:block;font-family:var(--display);font-size:24px}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.tag{display:inline-block;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:#e1f2e7;color:var(--ok)}.tag.no{background:var(--gold-soft);color:#7a4a00}.tag.dif{background:#fdf0d8;color:#9c5c00}
.nota{font-size:13px;color:var(--muted);margin:6px 0 12px}
#imp{display:none}

/* ================== IMPRESIÓN ================== */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;padding:0;font:11pt/1.3 Arial,Helvetica,sans-serif}
  #app,header,.barra,dialog,.toast{display:none!important}
  #imp{display:block}
  .copia{break-after:page;page-break-after:always;padding:0 2mm}
  .copia:last-child{break-after:auto;page-break-after:auto}
  .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
  .ph .emp{font-size:10pt}.ph .emp b{font-size:13pt}
  .ph .tit{text-align:right}.ph .tit b{font-size:18pt;letter-spacing:.05em}
  .copytag{display:inline-block;border:1.5px solid #000;padding:2px 8px;font-weight:700;margin-top:4px}
  .meta{display:flex;gap:30px;margin:6px 0 10px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse}
  th,td{border:1px solid #000;padding:5px 6px}
  th{background:#e6e6e6;font-size:9.5pt;text-transform:uppercase}
  td.n{text-align:right;white-space:nowrap}
  tr.sep td{background:#f2f2f2;font-weight:700;font-size:9.5pt}
  tfoot td{font-weight:700;font-size:12pt}
  .pobs{border:1px solid #000;padding:6px;margin-top:8px;min-height:14mm;white-space:pre-wrap}
  .pie{display:flex;gap:12px;margin-top:14px}
  .pie div{flex:1;border:1px solid #000;height:22mm;padding:4px 6px;font-size:9pt}
  td.big{height:9mm}
}
</style>
</head>

<script>
/* =================== CONFIGURACIÓN =================== */
// URL del Apps Script de la hoja PEDIDOS TIENDA (Implementar → Aplicación web). Se puede poner aquí o la primera vez en la app.
const API_DEF = "https://script.google.com/macros/s/AKfycbysLH9zV2Tss0fjnkv9USLkm6HZx7y_sBxEPf9_XG_EzxTCydsWcHPoEPY6uGp51qk8LA/exec";
const EMPRESA = {n:"LÁCTEOS CUQUERELLA, S.L.", s:"Quesos El Hidalgo · Manzanares"};
const GRUPOS = {X:["Sin sal / requesón","--otros"],M:["Mezcla","--mezcla"],O:["Oveja","--oveja"],D:["Manchego D.O.","--do"],C:["Cabra","--cabra"],V:["Avería","--averia"]};
// Orden de preparación: sin sal y requesón, mezclas, ovejas, manchegos, cabras, porciones (3ª letra P) y averías
const SECC = [["X","Sin sal y requesón"],["M","Mezcla"],["O","Oveja"],["D","Manchego D.O."],["C","Cabra"],["P","Porciones"],["V","Averías"]];
const ESTADOS = ["ENVIADO","PREPARANDO","PREPARADO","ALBARANADO","ANULADO"];
const EST_TXT = {ENVIADO:"Enviado",PREPARANDO:"Preparando",PREPARADO:"Preparado",ALBARANADO:"Con albarán",ANULADO:"Anulado"};

/* =================== utilidades =================== */
const $=s=>document.querySelector(s);
const LOGO=document.querySelector(".logo img").src;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
          del(k){try{localStorage.removeItem(k)}catch(e){}}};
const num=v=>{const x=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(x)?x:0};
const r2=x=>Math.round((x+1e-9)*100)/100;
const eur=x=>(+x||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
const kgf=x=>(+x||0).toLocaleString("es-ES",{minimumFractionDigits:1,maximumFractionDigits:3});
const dec=x=>x===""||x==null?"":String(x).replace(".",",");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoy=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fCorta=iso=>{if(!iso)return"";const d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString("es-ES",{day:"numeric",month:"numeric"})+" "+d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})};
const fDia=iso=>{if(!iso)return"";const d=new Date(iso.length===10?iso+"T12:00:00":iso);return isNaN(d)?iso:d.toLocaleDateString("es-ES",{day:"numeric",month:"numeric",year:"numeric"})};
const fDiaCorto=iso=>{const d=new Date(iso);return isNaN(d)?"":d.getDate()+"/"+(d.getMonth()+1)};
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(t,err){const d=document.createElement("div");d.className="toast"+(err?" err":"");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),err?4500:2200)}
function confirmar(tit,txt,motivo){return new Promise(res=>{$("#cTit").textContent=tit;$("#cTxt").textContent=txt;const m=$("#cMot");m.hidden=!motivo;m.value="";
  const d=$("#dConf");$("#cOk").onclick=()=>{d.close();res({ok:true,motivo:m.value})};d.onclose=()=>res({ok:false});d.showModal()})}
document.addEventListener("click",e=>{const c=e.target.closest("[data-close]");if(c)c.closest("dialog").close()});

/* =================== estado =================== */
const S={
  api: new URLSearchParams(location.search).get("api") || LS.get("ped_api","") || API_DEF,
  pin: LS.get("ped_pin",""), user:null, rol:null,
  productos: LS.get("ped_cache_prod",[]), pedidos:[], albaranes:[],
  tab:null, scr:null,          // scr: {t:"editar"|"preparar"|"ver"|"albaran"|"verAlb", ...}
  borr: LS.get("ped_borrador",null),   // borrador de pedido nuevo
  sel: new Set(), busy:false, ult:null, filtroAlb:""
};
if(new URLSearchParams(location.search).get("api")) LS.set("ped_api",S.api);

async function api(accion,datos={}){
  if(!S.api) throw new Error("Falta configurar la dirección del servidor");
  let r;
  try{
    r=await fetch(S.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion,pin:S.pin,...datos})});
  }catch(e){throw new Error("Sin conexión con el servidor. Comprueba la cobertura e inténtalo otra vez.")}
  let j; try{j=await r.json()}catch(e){throw new Error("El servidor no responde bien (¿está publicada la última versión del script?)")}
  if(!j.ok){ if(j.pin){S.pin="";S.user=null;S.rol=null;S.scr=null;LS.del("ped_pin");} throw new Error(j.error||"Error del servidor"); }
  return j;
}

async function cargar(silencioso){
  try{
    const j=await api("datos");
    S.user=j.usuario;S.rol=j.rol;S.productos=j.productos;S.pedidos=j.pedidos;S.albaranes=j.albaranes||[];S.ult=new Date();
    LS.set("ped_cache_prod",S.productos);
    const escribiendo=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!silencioso||(!S.scr&&S.tab!=="precios"&&!escribiendo)) render(); else renderHeader();
  }catch(e){ if(!silencioso) toast(e.message,true); if(!S.pin) render(); }
}
setInterval(()=>{ if(document.visibilityState==="visible" && S.pin && S.user && !S.busy) cargar(true); },30000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.pin && S.user) cargar(true); });

/* =================== productos =================== */
const prod=c=>S.productos.find(p=>p.c===c);
const activos=()=>S.productos.filter(p=>p.activo!==false);
const grupoDe=c=>(prod(c)||{}).g||"X";
const colorG=g=>(GRUPOS[g]||GRUPOS.X)[1];
const bandTxt=(pz,b)=>b>1&&pz>=b?(pz%b===0?`${pz/b} band.`:`${Math.floor(pz/b)} band. + ${pz%b} pz`):"";
const tintG=g=>colorG(g)+"-t";
const estiloG=g=>`--c:var(${colorG(g)});--t:var(${tintG(g)})`;
const esPorcion=p=>"MODC".includes(p.g||"X")&&String(p.c||"").replace(/\s+/g,"").charAt(2)==="P";
const seccion=p=>p.g==="V"?"V":esPorcion(p)?"P":(GRUPOS[p.g]?p.g:"X");
const SECC_I=Object.fromEntries(SECC.map((x,i)=>[x[0],i]));
const seccTit=k=>(SECC.find(x=>x[0]===k)||SECC[0])[1];
const cabSecc=k=>`<div class="grupo s-${k}">${seccTit(k)}</div>`;
function rangos(lista){const m={};lista.map((p,i)=>({p,i})).sort((a,b)=>SECC_I[seccion(a.p)]-SECC_I[seccion(b.p)]||a.i-b.i).forEach((x,k)=>{m[x.p.c]=k});return m}
function ordenProds(lista){const m=rangos(lista);return lista.slice().sort((a,b)=>m[a.c]-m[b.c])}
function ordenLineas(ls){const m=rangos(S.productos);return ls.slice().sort((a,b)=>(m[a.c]??1e4)-(m[b.c]??1e4))}
const esDesk=()=>window.matchMedia("(min-width: 1000px)").matches&&(S.rol==="ADMIN"||S.rol==="OFICINA");
window.matchMedia("(min-width: 1000px)").addEventListener("change",()=>{if(S.user){S.scr=null;render()}});

/* =================== cabecera y pestañas =================== */
function tabsDeRol(){
  const n=e=>S.pedidos.filter(p=>p.estado===e).length;
  if(S.rol==="TIENDA") return [["nuevo","Nuevo pedido"],["mios","Mis pedidos"]];
  if(S.rol==="FABRICA") return [["preparar","Por preparar",n("ENVIADO")+n("PREPARANDO")],["hechos","Preparados"]];
  if(esDesk()) return [["pedidos","Pedidos",n("ENVIADO")+n("PREPARADO")],["historial","Histórico"],["albaranes","Albaranes"],["exportar","Exportar"],["precios","Artículos y precios"],["nuevo","+ Pedido"]];
  return [["pedidos","Pedidos",n("ENVIADO")+n("PREPARADO")],["albaranes","Albaranes"],["nuevo","+ Pedido"],["precios","Precios"]];
}
function renderHeader(){
  const h=$("#hdr"); h.hidden=!S.user;
  if(!S.user) return;
  $("#hWho").innerHTML=`<b>${esc(S.user)}</b>${S.user!==S.rol?" · "+esc(S.rol):""}${S.ult?` · ${S.ult.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}`:""}<br><button id="bSalir">Salir</button>`;
  const tabs=tabsDeRol(); if(!S.tab||!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  $("#nav").innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" class="${S.tab===t[0]&&(!S.scr||(t[0]==="nuevo"&&S.scr.t==="editar"&&!S.scr.ped.id))?"on":""}">${t[1]}${t[2]?`<span class="badge">${t[2]}</span>`:""}</button>`).join("");
}
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;S.tab=b.dataset.tab;S.scr=null;S.sel.clear();render();scrollTo(0,0)});
document.addEventListener("click",async e=>{ if(e.target.id==="bSalir"){const c=await confirmar("Salir","¿Cerrar la sesión en este móvil?");if(c.ok){S.pin="";S.user=null;LS.del("ped_pin");render()}} });

/* =================== render principal =================== */
function barra(html){const b=$("#barra");b.hidden=!html;$("#barraIn").innerHTML=html||""}
function render(){
  document.body.classList.toggle("desk",!!S.user&&esDesk());
  renderHeader();
  const app=$("#app"); app.onclick=app.oninput=app.onchange=null;
  if(!S.api) return vConfig(app);
  if(!S.pin||!S.user) return vLogin(app);
  if(S.scr){
    const f={editar:vEditar,preparar:vPreparar,ver:vVer,albaran:vAlbaran,verAlb:vVerAlb}[S.scr.t];
    return f(app);
  }
  ({nuevo:()=>{S.scr={t:"editar",ped:nuevoBorrador()};render()},mios:vListaTienda,preparar:vListaFab,hechos:vListaFabHechos,
    pedidos:esDesk()?vPedidosDesk:vListaOficina,albaranes:esDesk()?vAlbaranesDesk:vAlbaranes,precios:vPrecios,
    historial:vHistorial,exportar:vExportar})[S.tab](app);
}

/* =================== configuración y login =================== */

  barra("");
  app.innerHTML=`<div class="login"><span class="logo"><img src="${LOGO}" alt="Quesos El Hidalgo"></span><h1>Pedidos tienda</h1><p class="sub">Pega la dirección del servidor (Apps Script de la hoja PEDIDOS TIENDA).</p>
  <div class="cfg"><input id="fApi" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:14px;letter-spacing:0;text-align:left">
  <button class="btn pri" id="bApi">Guardar</button></div></div>`;
  $("#bApi").onclick=()=>{const v=$("#fApi").value.trim();if(!/^https:\/\/script\.google\.com\//.test(v))return toast("Esa dirección no parece de Apps Script",true);S.api=v;LS.set("ped_api",v);render()};
}
function vLogin(app){
  barra("");
  app.innerHTML=`<div class="login"><span class="logo"><img src="${LOGO}" alt="Quesos El Hidalgo"></span><h1>Pedidos tienda</h1><div class="sub">Tienda · Fábrica · Oficina</div>
  <form id="fLog"><input id="fPin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
  <button class="btn pri">Entrar</button></form></div>`;
  const i=$("#fPin");i.focus();

    try{await api("login");LS.set("ped_pin",S.pin);S.tab=null;S.scr=null;await cargar()}catch(err){toast(err.message,true);S.pin="";S.user=null;i.value="";i.focus()}};
  if(S.pin){ cargar(); }

/* =================== tarjetas de pedido =================== */
function totPz(p){return p.lineas.reduce((s,l)=>s+(l.pzS??l.pz),0)}
function tarjeta(p,sel){
  const nl=p.lineas.length, pz=totPz(p);
  return `<div class="card ped" data-ver="${esc(p.id)}">
    ${sel?`<input type="checkbox" class="selbox" data-sel="${esc(p.id)}" ${S.sel.has(p.id)?"checked":""} aria-label="Seleccionar pedido ${esc(p.id)}">`:`<span></span>`}
    <b>Pedido ${esc(p.id)}</b><span class="chip e-${p.estado}">${EST_TXT[p.estado]||p.estado}</span>
    <div class="meta">${fCorta(p.creado)} · ${esc(p.creadoPor)} · ${nl} productos · ${pz} pz${p.albaran?` · Albarán ${esc(p.albaran)}`:""}${p.obs?" · 📝":""}</div>
  </div>`;
}
function onLista(app){
  app.onclick=e=>{
    if(e.target.matches("[data-sel]")){const id=e.target.dataset.sel;e.target.checked?S.sel.add(id):S.sel.delete(id);render();return}
    const c=e.target.closest("[data-ver]"); if(c){S.scr={t:"ver",id:c.dataset.ver};render();scrollTo(0,0)}
    const a=e.target.closest("[data-alb]"); if(a){S.scr={t:"verAlb",num:a.dataset.alb};render();scrollTo(0,0)}
  };
}
const ordenados=(est)=>S.pedidos.filter(p=>est.includes(p.estado)).sort((a,b)=>(+b.id)-(+a.id));

/* =================== listas por rol =================== */
function vListaTienda(app){
  barra(`<span class="muted">${S.pedidos.length} pedidos recientes</span><button class="btn pri" id="bNuevo">+ Nuevo pedido</button>`);
  const act=ordenados(["ENVIADO","PREPARANDO","PREPARADO"]), cer=ordenados(["ALBARANADO","ANULADO"]);
  app.innerHTML=`<div class="wrap">${act.length?`<div class="sec">En curso</div>`+act.map(p=>tarjeta(p)).join(""):""}
    <div class="sec">Terminados</div>${cer.map(p=>tarjeta(p)).join("")||`<div class="vacio">Todavía no hay pedidos terminados.</div>`}</div>`;
  onLista(app); $("#bNuevo").onclick=()=>{S.tab="nuevo";render()};
}
function vListaFab(app){
  barra("");
  const pend=ordenados(["ENVIADO"]).reverse(), prep=ordenados(["PREPARANDO"]).reverse();
  app.innerHTML=`<div class="wrap">
    <div class="sec">Preparando</div>${prep.map(p=>tarjeta(p)).join("")||`<div class="vacio">Ninguno a medias.</div>`}
    <div class="sec">Nuevos</div>${pend.map(p=>tarjeta(p)).join("")||`<div class="vacio">No hay pedidos nuevos.</div>`}</div>`;
  onLista(app);
}
function vListaFabHechos(app){
  barra("");
  app.innerHTML=`<div class="wrap"><div class="sec">Preparados, pendientes de albarán</div>${ordenados(["PREPARADO"]).map(p=>tarjeta(p)).join("")||`<div class="vacio">Ninguno.</div>`}
  <div class="sec">Con albarán</div>${ordenados(["ALBARANADO"]).slice(0,30).map(p=>tarjeta(p)).join("")||`<div class="vacio">Ninguno.</div>`}</div>`;
  onLista(app);
}
function vListaOficina(app){
  const prep=ordenados(["PREPARADO"]);
  for(const id of [...S.sel]) if(!prep.some(p=>p.id===id)) S.sel.delete(id);
  barra(prep.length?`<span class="muted">${S.sel.size} pedido(s) elegidos</span><button class="btn pri" id="bHacer" ${S.sel.size?"":"disabled"}>Hacer albarán</button>`:"");
  app.innerHTML=`<div class="wrap">
    <div class="sec">Preparados · marca los que van en el albarán</div>${prep.map(p=>tarjeta(p,true)).join("")||`<div class="vacio">No hay pedidos preparados.</div>`}
    <div class="sec">Nuevos</div>${ordenados(["ENVIADO"]).map(p=>tarjeta(p)).join("")||`<div class="vacio">Ninguno.</div>`}
    <div class="sec">Preparándose</div>${ordenados(["PREPARANDO"]).map(p=>tarjeta(p)).join("")||`<div class="vacio">Ninguno.</div>`}
    <div class="sec">Últimos cerrados</div>${ordenados(["ALBARANADO","ANULADO"]).slice(0,30).map(p=>tarjeta(p)).join("")||`<div class="vacio">Ninguno.</div>`}</div>`;
  onLista(app);
  const b=$("#bHacer"); if(b) b.onclick=()=>{S.scr={t:"albaran",alb:borradorAlbaran([...S.sel])};render();scrollTo(0,0)};
}

/* =================== pedido: crear / editar =================== */
function nuevoBorrador(){
  if(S.borr && !S.borr.id) return S.borr;
  return {id:null,obs:"",lineas:[]};
}
function guardarBorrador(){ if(S.scr&&S.scr.t==="editar"&&!S.scr.ped.id){S.borr=S.scr.ped;LS.set("ped_borrador",S.borr)} }
function vEditar(app){
  const P=S.scr.ped, q=(S.scr.q||"").trim().toUpperCase();
  const cant=c=>(P.lineas.find(l=>l.c===c)||{}).pz||0;
  const lista=ordenProds(activos().filter(p=>!q||p.c.toUpperCase().includes(q)||p.n.toUpperCase().includes(q)));
  let h="",gAnt=null;
  for(const p of lista){
    const k=seccion(p); if(k!==gAnt){h+=cabSecc(k);gAnt=k}
    const n=cant(p.c);
    h+=`<div class="prod ${n?"has":""}" style="${estiloG(p.g)}">
      <div class="pn"><b>${esc(p.c)}</b><span>${esc(p.n)} · ${eur(p.p)} €/kg</span></div>
      <div class="step"><button data-m="${esc(p.c)}" aria-label="Quitar una pieza">−</button><input class="num" inputmode="numeric" value="${n||""}" data-q="${esc(p.c)}" aria-label="Piezas ${esc(p.c)}"><button data-p="${esc(p.c)}" aria-label="Añadir una pieza">+</button></div>
      ${p.b>1?`<div class="band"><button data-bp="${esc(p.c)}">+ 1 bandeja (${p.b} pz)</button>${n?`<span>${bandTxt(n,p.b)}</span>`:""}</div>`:""}
    </div>`;
  }
  const ultimo=S.pedidos.filter(x=>x.estado!=="ANULADO").sort((a,b)=>(+b.id)-(+a.id))[0];
  const editando=!!P.id;
  app.innerHTML=`<div class="wrap">
    ${editando?`<div class="aviso">Modificando el pedido ${esc(P.id)}. Pulsa «Guardar cambios» al terminar.</div>`:""}
    <div class="acc" style="margin-bottom:8px">
      <input id="fQ" placeholder="Buscar producto…" value="${esc(S.scr.q||"")}" style="flex:1">
      ${!editando&&ultimo&&!P.lineas.length?`<button class="btn" id="bRep">Repetir último</button>`:""}
      ${!editando&&P.lineas.length?`<button class="btn del" id="bVaciar">Vaciar</button>`:""}
      ${editando?`<button class="btn" id="bCanc">Cancelar</button>`:""}
    </div>
    ${h||`<div class="vacio">Ningún producto coincide.</div>`}
    <div class="sec">Observaciones</div>
    <textarea id="fObs" placeholder="Ej.: si no hay curado grande, mandad mediano. Averías: …">${esc(P.obs)}</textarea>
  </div>`;
  const pz=P.lineas.reduce((s,l)=>s+l.pz,0);
  barra(`<div class="tot"><small>${P.lineas.length} productos</small>${pz} piezas</div><button class="btn pri" id="bEnv" ${P.lineas.length?"":"disabled"}>${editando?"Guardar cambios":"Enviar pedido"}</button>`);

  const setQ=(c,n)=>{n=Math.max(0,Math.round(n));const i=P.lineas.findIndex(l=>l.c===c);const pr=prod(c);
    if(n===0){if(i>=0)P.lineas.splice(i,1)} else if(i>=0)P.lineas[i].pz=n; else P.lineas.push({c,n:pr.n,pz:n,p:pr.p});
    guardarBorrador();};
  app.onclick=e=>{const t=e.target;
    if(t.dataset.p){setQ(t.dataset.p,cant(t.dataset.p)+1);render()}
    else if(t.dataset.m){setQ(t.dataset.m,cant(t.dataset.m)-1);render()}
    else if(t.dataset.bp){const pr=prod(t.dataset.bp);setQ(pr.c,cant(pr.c)+pr.b);render()}
  };
  app.querySelectorAll("[data-q]").forEach(i=>i.onchange=()=>{setQ(i.dataset.q,num(i.value));render()});
  $("#fQ").oninput=e=>{S.scr.q=e.target.value;const pos=e.target.selectionStart;render();const f=$("#fQ");f.focus();f.setSelectionRange(pos,pos)};
  $("#fObs").oninput=e=>{P.obs=e.target.value;guardarBorrador()};
  const rep=$("#bRep"); if(rep) rep.onclick=()=>{P.lineas=ultimo.lineas.filter(l=>!l.extra&&l.pz>0&&prod(l.c)).map(l=>({c:l.c,n:prod(l.c).n,pz:l.pz,p:prod(l.c).p}));guardarBorrador();render();toast("Copiado el pedido "+ultimo.id+". Revisa las cantidades.")};
  const vac=$("#bVaciar"); if(vac) vac.onclick=async()=>{const c=await confirmar("Vaciar pedido","¿Borrar todo lo que has puesto?");if(c.ok){P.lineas=[];P.obs="";guardarBorrador();render()}};
  const can=$("#bCanc"); if(can) can.onclick=()=>{S.scr={t:"ver",id:P.id};render()};
  $("#bEnv").onclick=async()=>{
    const c=await confirmar(editando?"Guardar cambios":"Enviar pedido",`${P.lineas.length} productos, ${pz} piezas. ¿${editando?"Guardar":"Enviar a la fábrica"}?`);
    if(!c.ok)return;
    S.busy=true;$("#bEnv").disabled=true;
    try{const j=await api("guardarPedido",{pedido:{id:P.id,version:P.version,obs:P.obs,lineas:P.lineas}});
      if(!editando){S.borr=null;LS.del("ped_borrador")}
      toast(editando?"Cambios guardados":"Pedido "+j.pedido.id+" enviado");
      S.scr=S.rol==="TIENDA"?null:{t:"ver",id:j.pedido.id};S.tab=S.rol==="TIENDA"?"mios":S.tab;await cargar();
    }catch(err){toast(err.message,true);if(/Otra persona/.test(err.message)){S.scr=null;await cargar()}}
    finally{S.busy=false;const b=$("#bEnv");if(b)b.disabled=false}
  };
}

/* =================== ver pedido =================== */
function vVer(app){
  const p=S.pedidos.find(x=>x.id===S.scr.id);
  if(!p){S.scr=null;return render()}
  const R=S.rol, E=p.estado;

  const puedeAnular=(R==="TIENDA"&&E==="ENVIADO")||((R==="OFICINA"||R==="ADMIN")&&!["ALBARANADO","ANULADO"].includes(E));
  const alb=p.albaran&&S.albaranes.find(a=>String(a.num)===p.albaran);

      <div class="lt">${l.extra?"—":l.pz+" pz"}${pr.b>1&&l.pz?` <small class="muted">${bandTxt(l.pz,pr.b)}</small>`:""}</div>
      ${serv!=null||l.kg?`<div class="muted" style="grid-column:1/-1;font-size:13px">Servido: ${serv??l.pz} pz${l.kg?` · ${kgf(l.kg)} kg`:""}${l.obs?` · ${esc(l.obs)}`:""}</div>`:""}</div>`}).join("");
  app.innerHTML=`<div class="wrap">
    <div class="acc" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="btn sm" id="bVolver">← Volver</button><span class="chip e-${E}">${EST_TXT[E]}</span></div>
    <div class="card"><b style="font-size:18px">Pedido ${esc(p.id)}</b>
      <div class="muted">Hecho ${fCorta(p.creado)} por ${esc(p.creadoPor)}${p.actualizadoPor&&p.actualizado!==p.creado?` · último cambio ${fCorta(p.actualizado)} (${esc(p.actualizadoPor)})`:""}</div>
      ${p.albaran?`<div style="margin-top:4px">Albarán nº <b>${esc(p.albaran)}</b>${alb?` · ${kgf(alb.kg)} kg · ${eur(alb.total)} €`:""}</div>`:""}</div>
    ${p.obs?`<div class="obsbox"><b>Observaciones de la tienda:</b>\n${esc(p.obs)}</div>`:""}
    ${p.obsF?`<div class="obsbox"><b>Notas de fábrica:</b>\n${esc(p.obsF)}</div>`:""}
    <div class="card">${filas}</div>
    <div class="acc">
      ${puedeEditar?`<button class="btn" id="bEdit">Modificar</button>`:""}
      ${R!=="TIENDA"?`<button class="btn" id="bHoja">Imprimir hoja de preparación</button>`:""}
      ${alb?`<button class="btn" id="bVerAlb">Ver albarán</button>`:""}
      ${puedeAnular?`<button class="btn del" id="bAnular">Anular pedido</button>`:""}
    </div>
    ${R==="TIENDA"&&E!=="ENVIADO"&&E!=="ALBARANADO"&&E!=="ANULADO"?`<p class="muted">El pedido ya se está preparando. Para cambiar algo, llama a la fábrica.</p>`:""}
  </div>`;
  barra(puedePreparar?`<span class="muted">${totPz(p)} piezas</span><button class="btn pri" id="bPrep">${E==="PREPARADO"?"Corregir preparación":E==="PREPARANDO"?"Seguir preparando":"Preparar pedido"}</button>`:"");
  $("#bVolver").onclick=()=>{S.scr=null;render()};
  const ed=$("#bEdit"); if(ed) ed.onclick=()=>{S.scr={t:"editar",ped:clone({id:p.id,version:p.version,obs:p.obs,lineas:p.lineas.map(l=>({c:l.c,n:l.n,pz:l.pz,p:l.p}))})};render();scrollTo(0,0)};

function borradorAlbaran(ids){
  const peds=ids.map(id=>S.pedidos.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(+a.id)-(+b.id));
  const lineas=[];
  for(const p of peds) for(const l of ordenLineas(p.lineas)){const pz=l.pzS??l.pz;if(!(pz>0||l.kg>0))continue;
    const pr=prod(l.c);lineas.push({pedido:p.id,dia:fDiaCorto(p.creado),c:l.c,n:l.n,pz,kg:l.kg||"",p:pr?pr.p:l.p})}
  return {pedidos:peds.map(p=>p.id),fecha:hoy(),cliente:"CASA",obs:peds.map(p=>p.obsF).filter(Boolean).join("\n"),lineas};
}

const fCsv=f=>{const d=String(f).slice(0,10).split("-");return d.length===3?`${d[2]}/${d[1]}/${d[0]}`:f};
function exportarCsv(albs,nombre){
  if(!albs.length)return toast("No hay albaranes que exportar",true);
  const f=x=>String(x).replace(".",",");
  const rows=[["ALBARAN","FECHA","CLIENTE","PEDIDO","CODIGO","DESCRIPCION","PIEZAS","KG","PRECIO","IMPORTE"]];
  albs.slice().sort((a,b)=>(+a.num)-(+b.num)).forEach(a=>a.lineas.forEach(l=>rows.push([a.num,fCsv(a.fecha),a.cliente,l.pedido,l.c,l.n||(prod(l.c)||{}).n||"",l.pz,f(l.kg),f(l.p),f(r2(l.kg*l.p))])));
  const csv=rows.map(r=>r.map(v=>/[;"\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(";")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${nombre||"albaranes_tienda_"+hoy()}.csv`;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

  app.onclick=async e=>{const t=e.target.closest("button");if(!t)return;
    if(t.dataset.act!=null){P[t.dataset.act].activo=P[t.dataset.act].activo===false;render()}
    else if(t.dataset.mv!=null){const a=P[t.dataset.mv],b=vecino(a,+t.dataset.d);if(b){const ia=idx(a),ib=idx(b);P[ia]=b;P[ib]=a;render()}}
    else if(t.dataset.del!=null){const c=await confirmar("Borrar artículo","¿Borrar "+P[t.dataset.del].c+"? Si solo quieres que la tienda no lo vea, pulsa «Activo» para dejarlo «Oculto».");if(c.ok){P.splice(+t.dataset.del,1);render()}}};
  $("#bAddP").onclick=()=>{P.push({c:"",n:"",g:"X",p:0,b:1,activo:true});render();const ins=app.querySelectorAll('[data-f="c"]');for(const x of ins)if(!x.value){x.focus();x.scrollIntoView({block:"center"});break}};
  $("#bDesh").onclick=()=>{S.precEd=clone(S.productos);render()};
  $("#bGP").onclick=async()=>{
    const vacios=P.filter(p=>!String(p.c).trim());if(vacios.length)return toast("Hay un artículo sin código",true);
    const c=await confirmar("Guardar artículos y precios","Los pedidos y albaranes nuevos usarán estos precios y este orden.");if(!c.ok)return;
    try{const j=await api("guardarProductos",{productos:ordenProds(P).map(p=>({...p,p:num(p.p),b:num(p.b)}))});S.productos=j.productos;S.precEd=clone(j.productos);toast("Guardado");render()}
    catch(err){toast(err.message,true)}};
}

/* =================== ESCRITORIO: histórico =================== */
const haceDias=d=>{const x=new Date();x.setDate(x.getDate()-d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
S.H={desde:haceDias(30),hasta:hoy(),estado:"",q:"",exp:"pend",data:null,cargando:false,err:"",abiertos:new Set(),selExp:null};
async function cargarHist(){
  S.H.cargando=true;S.H.err="";S.H.selExp=null;render();
  try{const j=await api("historial",{desde:S.H.desde,hasta:S.H.hasta});S.H.data={pedidos:j.pedidos,albaranes:j.albaranes}}
  catch(e){S.H.err=e.message;const en=f=>f>=S.H.desde&&f<=S.H.hasta;
    S.H.data={pedidos:S.pedidos.filter(p=>en(String(p.creado).slice(0,10))),albaranes:S.albaranes.filter(a=>en(String(a.fecha).slice(0,10)))}}
  S.H.cargando=false;render();
}
function filtroFechas(extra){
  return `<div class="filtros">
    <label class="lbl">Desde<input type="date" id="hD" value="${S.H.desde}"></label>
    <label class="lbl">Hasta<input type="date" id="hH" value="${S.H.hasta}"></label>
    <div class="acc"><button class="btn sm" data-rg="0">Hoy</button><button class="btn sm" data-rg="7">7 días</button><button class="btn sm" data-rg="30">30 días</button><button class="btn sm" data-rg="90">3 meses</button><button class="btn sm" data-rg="365">1 año</button></div>
    ${extra||""}<button class="btn pri" id="hBus">Buscar</button>${S.H.cargando?`<span class="muted">Cargando…</span>`:""}</div>
    ${S.H.err?`<div class="aviso">No se ha podido leer el histórico completo del servidor (${esc(S.H.err)}). Se muestran solo los datos de los últimos 60 días. Si dice «Acción desconocida», falta pegar la última versión del script en Google.</div>`:""}`;
}
function enlazarFiltro(app){
  $("#hD").onchange=e=>{S.H.desde=e.target.value};$("#hH").onchange=e=>{S.H.hasta=e.target.value};
  $("#hBus").onclick=cargarHist;
  app.querySelectorAll("[data-rg]").forEach(b=>b.onclick=()=>{S.H.desde=haceDias(+b.dataset.rg);S.H.hasta=hoy();cargarHist()});
}
const servido=l=>l.pzS??l.pz;
const esDif=l=>!!l.extra||(l.pzS!=null&&l.pzS!==l.pz);
function vHistorial(app){
  barra("");
  if(!S.H.data&&!S.H.cargando){cargarHist();return}
  const q=S.H.q.trim().toUpperCase();
  const peds=(S.H.data?S.H.data.pedidos:[]).filter(p=>(!S.H.estado||(S.H.estado==="DIF"?p.lineas.some(esDif):p.estado===S.H.estado))&&(!q||p.id===q||p.lineas.some(l=>String(l.c).includes(q))))
    .sort((a,b)=>(+b.id)-(+a.id));
  const tPed=peds.reduce((s,p)=>s+p.lineas.reduce((x,l)=>x+(+l.pz||0),0),0), tSer=peds.reduce((s,p)=>s+p.lineas.reduce((x,l)=>x+(+servido(l)||0),0),0);
  const tKg=peds.reduce((s,p)=>s+p.lineas.reduce((x,l)=>x+num(l.kg),0),0), nDif=peds.filter(p=>p.lineas.some(esDif)).length;
  const filas=peds.map(p=>{const pz=p.lineas.reduce((x,l)=>x+(+l.pz||0),0),sv=p.lineas.reduce((x,l)=>x+(+servido(l)||0),0),kg=p.lineas.reduce((x,l)=>x+num(l.kg),0),nd=p.lineas.filter(esDif).length,ab=S.H.abiertos.has(p.id);
    let r=`<tr class="cl" data-ab="${esc(p.id)}"><td><b>${ab?"▾":"▸"} ${esc(p.id)}</b></td><td>${fCorta(p.creado)}</td><td>${esc(p.creadoPor)}</td><td><span class="chip e-${p.estado}">${EST_TXT[p.estado]||p.estado}</span></td>
      <td class="n">${p.lineas.length}</td><td class="n">${pz}</td><td class="n">${p.estado==="ENVIADO"?"—":sv}</td><td class="n">${kg?kgf(kg):"—"}</td><td>${nd?`<span class="tag dif">${nd} cambio${nd>1?"s":""}</span>`:""}</td><td>${p.albaran?`Nº ${esc(p.albaran)}`:""}</td></tr>`;
    if(ab){r+=`<tr class="det"><td colspan="10">
      ${p.obs?`<div class="obsbox"><b>Tienda:</b> ${esc(p.obs)}</div>`:""}${p.obsF?`<div class="obsbox"><b>Fábrica:</b> ${esc(p.obsF)}</div>`:""}
      <table class="t sub"><thead><tr><th>Código</th><th>Producto</th><th class="n">Pedido</th><th class="n">Servido</th><th class="n">Diferencia</th><th class="n">Kg</th><th>Nota</th></tr></thead><tbody>
      ${ordenLineas(p.lineas).map(l=>{const d=(+servido(l)||0)-(+l.pz||0);return `<tr class="${esDif(l)?"dif":""}"><td><span class="dot" style="${estiloG(grupoDe(l.c))}"></span><b>${esc(l.c)}</b></td><td>${esc(l.n||(prod(l.c)||{}).n||"")}${l.extra?" <i>(añadido en fábrica)</i>":""}</td>
        <td class="n">${l.extra?"—":l.pz}</td><td class="n">${p.estado==="ENVIADO"?"—":servido(l)}</td><td class="n">${p.estado==="ENVIADO"||!d?"":(d>0?"+":"")+d}</td><td class="n">${l.kg?kgf(num(l.kg)):""}</td><td>${esc(l.obs||"")}</td></tr>`}).join("")}
      </tbody></table>
      <div class="acc" style="margin-top:8px"><button class="btn sm" data-hoja="${esc(p.id)}">Imprimir hoja de preparación</button>${S.pedidos.some(x=>x.id===p.id)?`<button class="btn sm" data-ir="${esc(p.id)}">Abrir pedido</button>`:""}${p.albaran?`<button class="btn sm" data-alb="${esc(p.albaran)}">Ver albarán ${esc(p.albaran)}</button>`:""}</div></td></tr>`}
    return r}).join("");
  app.innerHTML=`<div class="wrap">${filtroFechas(`<label class="lbl">Estado<select id="hE"><option value="">Todos</option>${ESTADOS.map(e=>`<option value="${e}"${S.H.estado===e?" selected":""}>${EST_TXT[e]}</option>`).join("")}<option value="DIF"${S.H.estado==="DIF"?" selected":""}>Con cambios</option></select></label><label class="lbl">Código o nº pedido<input id="hQ" value="${esc(S.H.q)}" placeholder="OCG, 12…" style="width:9em"></label>`)}
    <div class="kpis"><div class="kpi"><span>Pedidos</span><b>${peds.length}</b></div><div class="kpi"><span>Piezas pedidas</span><b>${tPed}</b></div><div class="kpi"><span>Piezas servidas</span><b>${tSer}</b></div><div class="kpi"><span>Kg servidos</span><b>${kgf(tKg)}</b></div><div class="kpi"><span>Con cambios</span><b>${nDif}</b></div></div>
    <p class="nota">Pulsa un pedido para ver línea a línea qué se pidió y qué se mandó. En amarillo, lo que cambió (piezas distintas o artículos añadidos en fábrica).</p>
    <div class="tblw"><table class="t"><thead><tr><th>Pedido</th><th>Fecha</th><th>Hecho por</th><th>Estado</th><th class="n">Artículos</th><th class="n">Pz pedidas</th><th class="n">Pz servidas</th><th class="n">Kg</th><th>Cambios</th><th>Albarán</th></tr></thead>
    <tbody>${filas||`<tr><td colspan="10" class="vacio">No hay pedidos en esas fechas.</td></tr>`}</tbody></table></div></div>`;
  enlazarFiltro(app);
  $("#hE").onchange=e=>{S.H.estado=e.target.value;render()};
  $("#hQ").onchange=e=>{S.H.q=e.target.value;render()};
  app.onclick=e=>{const t=e.target;
    const h=t.closest("[data-hoja]");if(h){imprimirHoja(S.H.data.pedidos.find(p=>p.id===h.dataset.hoja));return}
    const ir=t.closest("[data-ir]");if(ir){S.scr={t:"ver",id:ir.dataset.ir};render();scrollTo(0,0);return}
    const al=t.closest("[data-alb]");if(al){abrirAlbaran(al.dataset.alb);return}
    const r=t.closest("[data-ab]");if(r){const id=r.dataset.ab;S.H.abiertos.has(id)?S.H.abiertos.delete(id):S.H.abiertos.add(id);render()}};
}
function abrirAlbaran(num){
  if(!S.albaranes.some(a=>String(a.num)===String(num))){const a=(S.H.data?S.H.data.albaranes:[]).find(x=>String(x.num)===String(num));if(a)S.albaranes.push(a)}
  S.scr={t:"verAlb",num:String(num)};render();scrollTo(0,0);
}

/* =================== ESCRITORIO: exportar al programa de gestión =================== */
function vExportar(app){
  if(!S.H.data&&!S.H.cargando){barra("");cargarHist();return}
  const albs=(S.H.data?S.H.data.albaranes:[]).filter(a=>a.estado!=="ANULADO").sort((a,b)=>(+a.num)-(+b.num));
  const vis=albs.filter(a=>S.H.exp==="todos"||(S.H.exp==="pend"?!a.exportado:!!a.exportado));
  if(!S.H.selExp) S.H.selExp=new Set(albs.filter(a=>!a.exportado).map(a=>String(a.num)));
  const sel=vis.filter(a=>S.H.selExp.has(String(a.num)));
  app.innerHTML=`<div class="wrap">${filtroFechas(`<label class="lbl">Mostrar<select id="hX"><option value="pend"${S.H.exp==="pend"?" selected":""}>Pendientes de exportar</option><option value="hechos"${S.H.exp==="hechos"?" selected":""}>Ya exportados</option><option value="todos"${S.H.exp==="todos"?" selected":""}>Todos</option></select></label>`)}
    <p class="nota">Genera el archivo CSV (separado por «;», decimales con coma) con una línea por artículo de cada albarán, para importarlo en el programa de gestión. Después de descargarlo, márcalos como exportados para no importarlos dos veces. Columnas: ALBARAN · FECHA · CLIENTE · PEDIDO · CODIGO · DESCRIPCION · PIEZAS · KG · PRECIO · IMPORTE.</p>
    <div class="tblw"><table class="t"><thead><tr><th><input type="checkbox" id="xAll" class="selbox" ${vis.length&&sel.length===vis.length?"checked":""} aria-label="Marcar todos"></th><th>Nº</th><th>Fecha</th><th>Pedidos</th><th class="n">Líneas</th><th class="n">Kg</th><th class="n">Total</th><th>Exportado</th></tr></thead>
    <tbody>${vis.map(a=>`<tr><td><input type="checkbox" class="selbox" data-x="${esc(a.num)}" ${S.H.selExp.has(String(a.num))?"checked":""} aria-label="Albarán ${esc(a.num)}"></td><td><b>${esc(a.num)}</b></td><td>${fDia(a.fecha)}</td><td>${esc(a.pedidos)}</td><td class="n">${a.lineas.length}</td><td class="n">${kgf(a.kg)}</td><td class="n">${eur(a.total)} €</td>
      <td>${a.exportado?`<span class="tag ok">${fCorta(a.exportado)}${a.exportadoPor?" · "+esc(a.exportadoPor):""}</span>`:`<span class="tag no">Pendiente</span>`}</td></tr>`).join("")||`<tr><td colspan="8" class="vacio">No hay albaranes ${S.H.exp==="pend"?"pendientes de exportar ":""}en esas fechas.</td></tr>`}</tbody>
    <tfoot><tr><td></td><td colspan="4">${sel.length} marcados</td><td class="n">${kgf(sel.reduce((s,a)=>s+(+a.kg||0),0))}</td><td class="n">${eur(sel.reduce((s,a)=>s+(+a.total||0),0))} €</td><td></td></tr></tfoot></table></div></div>`;
  barra(`<span class="muted">${sel.length} albarán(es) marcados</span><div class="acc"><button class="btn" id="xMarcar" ${sel.length?"":"disabled"}>Marcar como exportados</button><button class="btn pri" id="xCsv" ${sel.length?"":"disabled"}>Descargar CSV</button></div>`);
  enlazarFiltro(app);
  $("#hX").onchange=e=>{S.H.exp=e.target.value;render()};
  app.onchange=e=>{const t=e.target;
    if(t.id==="xAll"){vis.forEach(a=>t.checked?S.H.selExp.add(String(a.num)):S.H.selExp.delete(String(a.num)));render()}
    else if(t.dataset.x){t.checked?S.H.selExp.add(t.dataset.x):S.H.selExp.delete(t.dataset.x);render()}};
  const marcar=async()=>{
    try{const j=await api("marcarExportado",{nums:sel.map(a=>String(a.num))});sel.forEach(a=>{a.exportado=j.fecha;a.exportadoPor=S.user;S.H.selExp.delete(String(a.num))});toast(j.marcados+" albarán(es) marcados como exportados");render()}
    catch(err){toast(err.message,true)}};
  $("#xCsv").onclick=async()=>{exportarCsv(sel,`albaranes_tienda_${sel[0].num}-${sel[sel.length-1].num}`);
    const c=await confirmar("Marcar como exportados",`¿Marcar estos ${sel.length} albaranes como ya exportados al programa de gestión? Hazlo cuando el archivo se haya descargado bien.`);if(c.ok)marcar()};
  $("#xMarcar").onclick=async()=>{const c=await confirmar("Marcar como exportados",`¿Marcar ${sel.length} albaranes como ya exportados, sin descargar el CSV?`);if(c.ok)marcar()};
}

/* =================== impresión =================== */
function cabecera(tit,num,tag){return `<div class="ph"><div class="emp"><b>${EMPRESA.n}</b><br>${EMPRESA.s}</div>
  <div class="tit"><b>${tit}</b>${num?`<br>Nº ${esc(num)}`:""}${tag?`<br><span class="copytag">${tag}</span>`:""}</div></div>`}
function imprimirAlbaran(a){
  const copia=tag=>{let ant=null;const varios=new Set(a.lineas.map(l=>l.pedido)).size>1;
    const filas=a.lineas.map(l=>{let s="";if(varios&&l.pedido!==ant){const p=S.pedidos.find(x=>x.id===l.pedido);s=`<tr class="sep"><td colspan="5">Pedido ${esc(l.pedido)}${p?" · "+fDiaCorto(p.creado):""}</td></tr>`;ant=l.pedido}
      return s+`<tr><td class="n">${l.pz}</td><td>${esc(l.c)} <span style="font-size:9pt">${esc(l.n)}</span></td><td class="n">${kgf(l.kg)}</td><td class="n">${eur(l.p)}</td><td class="n">${eur(r2(l.kg*l.p))}</td></tr>`}).join("");
    return `<section class="copia">${cabecera("ALBARÁN",a.num,tag)}
      <div class="meta"><div><b>Fecha:</b> ${fDia(a.fecha)}</div><div><b>Cliente:</b> ${esc(a.cliente)}</div><div><b>Pedidos:</b> ${esc(a.pedidos)}</div></div>
      <table><thead><tr><th style="width:10%">Piezas</th><th>Concepto</th><th style="width:13%">Kg</th><th style="width:14%">Precio €/kg</th><th style="width:15%">Total €</th></tr></thead>
      <tbody>${filas}</tbody><tfoot><tr><td colspan="2">TOTAL</td><td class="n">${kgf(a.kg)}</td><td></td><td class="n">${eur(a.total)}</td></tr></tfoot></table>
      ${a.obs?`<div class="pobs"><b>Observaciones:</b> ${esc(a.obs)}</div>`:""}
      <div class="pie"><div>Conforme cliente</div><div>Preparado por</div></div></section>`};
  $("#imp").innerHTML=copia("COPIA TIENDA")+copia("COPIA FACTURACIÓN");
  setTimeout(()=>window.print(),100);
}
function imprimirHoja(p){
  const filas=ordenLineas(p.lineas).map(l=>{const pr=prod(l.c)||{b:1};
    return `<tr><td><b>${esc(l.c)}</b> <span style="font-size:9pt">${esc(l.n)}</span></td><td class="n">${l.pz||""}${pr.b>1&&l.pz?` <span style="font-size:9pt">(${bandTxt(l.pz,pr.b)})</span>`:""}</td>
      <td class="n big">${l.pzS!=null&&l.pzS!==l.pz?l.pzS:""}</td><td class="n big">${l.kg?kgf(num(l.kg)):""}</td><td class="big"></td></tr>`}).join("");
  $("#imp").innerHTML=`<section class="copia">${cabecera("HOJA DE PREPARACIÓN","Pedido "+p.id)}
    <div class="meta"><div><b>Pedido:</b> ${fCorta(p.creado)}</div><div><b>Tienda:</b> CASA</div></div>
    ${p.obs?`<div class="pobs" style="margin-bottom:8px"><b>Observaciones de la tienda:</b> ${esc(p.obs)}</div>`:""}
    <table><thead><tr><th>Producto</th><th style="width:16%">Pedido</th><th style="width:14%">Servido pz</th><th style="width:16%">Kg</th><th style="width:7%">✓</th></tr></thead>
    <tbody>${filas}${'<tr><td class="big"></td><td></td><td></td><td></td><td></td></tr>'.repeat(4)}</tbody></table>
    <div class="pobs"><b>Notas de fábrica:</b> ${esc(p.obsF||"")}</div>
    <div class="pie"><div>Preparado por</div><div>Fecha</div></div></section>`;
  setTimeout(()=>window.print(),100);
}
