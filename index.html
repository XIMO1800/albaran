<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos Tienda</title>
<meta name="theme-color" content="#862133">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Misma línea que Recogida y TraceQueso: granate El Hidalgo, dorado, Barlow. Tema claro único (se usa en tienda y fábrica). */
:root{
  color-scheme:light;
  --brand:#862133; --brand-deep:#6a1010; --brand-soft:#f7e8eb; --gold:#c4952b; --gold-soft:#fbf1dc;
  --bg:#f2efee; --card:#ffffff; --surface2:#f7f4f3; --fg:#1d1618; --muted:#6a5f61; --line:#ddd4d5;
  --accent:var(--brand); --accent-fg:#fff; --soft:var(--brand-soft);
  /* colores de tarjetón, como en TraceQueso */
  --mezcla:#1e5e3a; --oveja:#1d3a7a; --do:#e0620b; --cabra:#b8a271; --averia:#c0262d; --otros:#6a5f61;
  --danger:#c0262d; --ok:#1e7443; --warn:#9c5c00;
  --mezcla-t:#e3efe7; --oveja-t:#e4e9f5; --do-t:#fdeedd; --cabra-t:#f6f0e1; --averia-t:#fbe4e4; --otros-t:#eeeae8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font:16px/1.4 var(--font);padding:0 0 110px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding:12px 16px;max-width:760px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 0 var(--brand-deep)}
.top-in{max-width:760px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;padding-block:8px 6px;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{display:flex;align-items:center;background:#fff;border-radius:8px;padding:3px 8px;flex:none}
.logo img{height:32px;width:auto;display:block}
.app-name{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.who{margin-left:auto;font-size:12px;text-align:right;line-height:1.3}
.who b{font-weight:700}
.who button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:2px}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;font-weight:700;font-size:15px;color:rgba(255,255,255,.75);white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#2b1d00;font-size:12px;font-weight:700;text-align:center;margin-left:5px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 0 var(--brand-deep)}
.btn.pri:active{transform:translateY(1px);box-shadow:none}
.btn.del{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px;min-height:36px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ped{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;cursor:pointer}
.ped b{font-family:var(--display);font-size:21px;font-weight:700}
.ped .meta{grid-column:2/4;color:var(--muted);font-size:14px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.e-ENVIADO{background:var(--gold-soft);color:#7a4a00}.e-PREPARANDO{background:#e1ecf9;color:#1d5796}
.e-PREPARADO{background:#e1f2e7;color:#1e7443}.e-ALBARANADO{background:#ebe6e7;color:#4a4042}.e-ANULADO{background:#fde4e4;color:#b3262d}
.sec{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);font-weight:700}
label.l{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;font-weight:700}
input,select,textarea{width:100%;min-width:0;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:17px}
textarea{min-height:64px;resize:vertical}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.vacio{color:var(--muted);text-align:center;padding:24px 8px}
.grupo{margin:18px 0 8px;padding:7px 12px;border-radius:10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:#fff;background:#5a4e50}
.s-X{background:#5a4e50}.s-M{background:var(--mezcla)}.s-O{background:var(--oveja)}.s-D{background:var(--do)}.s-C{background:var(--cabra);color:#3d2f10}.s-P{background:var(--gold);color:#2b1d00}.s-V{background:var(--averia)}
.prod{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;background:var(--t,var(--card));border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:9px 10px;margin-bottom:6px}
.prod.has{box-shadow:inset 0 0 0 2px var(--c)}
.prod .pn b{display:block;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.prod .pn span{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;cursor:pointer;color:var(--brand)}
.step input{width:58px;text-align:center;padding:8px 4px;font-family:var(--display);font-size:22px;font-weight:700}
.band{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.band button{border:1.5px solid var(--gold);background:var(--gold-soft);color:#6b4500;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer}
.lin{display:grid;grid-template-columns:1fr auto;gap:6px 8px;padding:10px 0;border-top:1px solid var(--line)}
.lin:first-child{border-top:0}
.lin .ln{font-weight:700}
.lin .ln small{font-weight:400;color:var(--muted)}
.lin .lt{font-family:var(--display);font-size:19px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.lin .lf{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:end}
.lin.ok .ln::after{content:" ✓";color:var(--ok)}
.plist{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.plin{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.plin .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:var(--t);border-bottom:1px solid var(--line)}
.plin .ln{font-weight:700;font-size:18px;line-height:1.2}
.plin .ln small{font-weight:500;color:var(--muted);font-size:15px}
.plin .lt{font-family:var(--display);font-size:22px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--c)}
.plin .lt small{display:block;font-size:14px;color:var(--muted)}
.plin .pb{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start;padding:10px 14px 12px}
.plin .pb .chk{width:56px;height:50px}
.plin .nbtn{width:48px;height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--muted)}
.plin .nbtn.on{border-color:var(--warn);color:var(--warn);background:#fff7e8}
.plin .pn{padding:0 14px 12px}
td.tsel select{min-width:10.5em}
.plin .pdif:empty,.plin .pband:empty{display:none}
.plin .pb>div:not(:last-child){text-align:center}
.plin .pb label.l{text-align:center}
.plin .pb input.num{text-align:center;height:50px;padding-block:0}
.plin .pb input[data-f="pzS"]{font-weight:800;font-size:22px;color:var(--fg)}
.aprox{color:var(--warn);font-weight:700;text-transform:none;letter-spacing:0}
.plin input.num::placeholder{color:#b3a8aa}
.plin .pb label.l{white-space:nowrap}
.plin .pband{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:3px}
.plin .pb>div:last-child{padding-top:18px}
.plin .pdif{display:block;color:var(--warn);font-weight:700;font-size:13px;margin-top:3px}
.plin .pn input{width:100%}
.plin.ok{border-color:var(--ok)}
.plin.ok .ln::after{content:" ✓";color:var(--ok)}
.chk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;cursor:pointer;color:var(--muted)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.x{border:0;background:none;color:var(--danger);font-size:24px;padding:6px 8px;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--c)}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:3px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.barra .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tot{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tot small{display:block;font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted)}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:20;background:#1d1618;color:#fff;padding:11px 16px;border-radius:12px;max-width:90vw;font-weight:600}
.toast.err{background:var(--danger)}
.aviso{background:var(--gold-soft);color:#5a3a00;border:1px solid #ecd59f;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.obsbox{background:var(--brand-soft);border-left:5px solid var(--brand);border-radius:10px;padding:10px 12px;margin-bottom:10px;white-space:pre-wrap}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,96vw);max-height:88vh;background:var(--bg);color:var(--fg)}
dialog::backdrop{background:rgba(29,22,24,.5)}
.dh{position:sticky;top:0;background:var(--brand);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh .btn{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.db{padding:12px 14px 16px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.pick button{border:1px solid var(--line);border-left:8px solid var(--c);background:var(--t,var(--card));border-radius:10px;padding:8px;text-align:left;cursor:pointer}
.pick button b{display:block;font-family:var(--display);font-size:18px}.pick button span{font-size:13px;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 1.4fr;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.prow .r2{grid-column:1/-1;display:grid;grid-template-columns:1fr 5.5em 4.5em auto auto;gap:6px;align-items:center}
.prow input,.prow select{padding:7px 8px;font-size:15px}
.mini{font-size:11px;color:var(--muted);text-align:center}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12vh 16px 24px;background:var(--brand);color:#fff;text-align:center}
.login .logo{padding:8px 16px;border-radius:12px;margin-bottom:14px}
.login .logo img{height:56px}
.login h1{font-family:var(--display);font-size:30px;margin:0;letter-spacing:.02em}
.login .sub{color:rgba(255,255,255,.8);font-size:14px}
.login form,.login .cfg{width:100%;max-width:320px}
.login input{text-align:center;font-family:var(--display);font-size:34px;letter-spacing:.3em;margin:18px 0 12px;border:0;color:var(--fg);background:#fff}
.login input::placeholder{color:#b9aeb0;letter-spacing:.1em;font-size:22px}
.pindots{display:flex;justify-content:center;gap:16px;margin:22px 0 24px}
.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.75)}
.pindots i.on{background:var(--gold);border-color:var(--gold)}
.login input#fPin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.login .pinbox{position:relative;cursor:text}
.srvaviso{margin-top:22px;max-width:320px;font-size:14px;color:rgba(255,255,255,.9)}
.srvaviso .btn{margin-top:8px}
.login .btn{width:100%;background:var(--gold);color:#2b1d00;border:0;box-shadow:0 2px 0 #8d6a1d;font-size:18px}
.selbox{width:24px;height:24px;accent-color:var(--brand)}
/* artículos y precios (móvil) */
.pcard{background:var(--t,var(--card));border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.pcard.off{opacity:.55}
.pc1{display:grid;grid-template-columns:9.5em 1fr;gap:6px}
.pcode{font-family:var(--display);font-weight:700!important;font-size:18px!important}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:end}
.pc2 label,.lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;gap:2px}
.pc3{display:flex;gap:6px;align-items:center}
.pc3 .x{margin-left:auto}
.mvb{width:40px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;color:var(--brand)}
.mvb:disabled{opacity:.3}
.tog{border-radius:99px;padding:6px 12px;font-weight:700;border:1.5px solid var(--ok);background:#e1f2e7;color:var(--ok);cursor:pointer;font-size:14px}
.tog.off{border-color:var(--line);background:#fff;color:var(--muted)}
/* escritorio: mismo marco y medidas que Recogida de leche */
#side{display:none}
.bar{display:none}
body.desk{font-size:17px;line-height:1.45}
/* escritorio: todo un poco más grande, en proporción */
html.desk{zoom:1.1}
@media (min-width:1500px){html.desk{zoom:1.22}}
@media print{html.desk{zoom:1}}
body.desk #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:265px;background:#3a0a0f;color:#fff;z-index:7;padding:0 12px 12px;gap:4px;overflow-y:auto}
.side-t{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1;padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
.sgrp{background:var(--brand-deep);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:4px 4px 6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.sgrp-av{margin-top:20px}
.lgrp-s{font-family:var(--display);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);padding:8px 10px 6px;margin:0 4px 6px;border-bottom:2px solid rgba(196,149,43,.75)}
.side-t small{display:block;font-family:var(--font);font-size:13.5px;font-weight:500;opacity:.9;margin-top:4px}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button,.navb{display:block;width:100%;text-align:left;background:transparent;border:0;color:rgba(255,255,255,.82);padding:11px 12px;border-radius:10px;font-weight:600;font-size:15.5px;cursor:pointer;font-family:var(--font)}
.snav button:hover,.navb:hover{background:rgba(255,255,255,.08);color:#fff}
.snav button.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.snav button small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.navb{border:1px solid rgba(255,255,255,.2);margin-top:6px;text-align:center}
body.desk header{margin-left:265px}
body.desk .top-in{max-width:none;padding-inline:28px}
body.desk nav#nav,body.desk .who{display:none}
body.desk .bar{display:flex;align-items:center;gap:10px;padding-block:18px 14px}
.hlogo{display:none}#hZ{display:none}body.desk #hZ{display:inline-block;align-self:flex-start;font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#3a0a0f;padding:3px 12px;border-radius:7px;line-height:1.25;margin-bottom:5px}body.desk .bar-t b{font-size:26px}
.stop{height:var(--hdrH,104px);margin:0 -12px 18px;padding:0 12px;background:var(--brand);box-shadow:0 2px 0 var(--brand-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:none}
.stop img{height:44px;width:auto;background:#fff;border-radius:9px;padding:5px 12px}.stop small{font-size:13px;opacity:.92;font-weight:500}
body.desk .brand{display:none}body.desk #nav{display:none}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-t b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.bar-t span{font-size:14px;opacity:.92}
body.desk #app{margin-left:265px}
body.desk .wrap{max-width:none;margin:0;padding:20px 28px 110px}
body.desk #app.scr .wrap{max-width:1100px}
body.desk .barra{left:265px}
body.desk .barra .in{max-width:none;padding-inline:12px}
body.desk .card{padding:14px 16px}
body.desk table.t{font-size:15.5px}
body.desk table.t th{font-size:12.5px;padding:10px 12px}
body.desk table.t td{padding:10px 12px}
body.desk .kpi{padding:10px 16px;min-width:130px;border-left:5px solid var(--brand)}
body.desk .kpi b{font-size:30px;line-height:1.1}
body.desk .kpi.kd{border-left-color:var(--warn)}
body.desk .nota{font-size:14px}
body.desk .filtros input,body.desk .filtros select{font-size:16px;padding:8px 10px}
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.lpanel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;position:sticky;top:130px;max-height:calc(100vh - 230px);overflow-y:auto}
.lgrp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);margin:12px 8px 6px}
.lgrp:first-child{margin-top:4px}
.litem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;cursor:pointer;margin-bottom:4px}
.litem:hover{background:var(--surface2)}
.litem.on{background:var(--brand-soft);border-color:#e3bfc6}
.lt1{flex:1;min-width:0}
.lt1 b{font-family:var(--display);font-size:20px}
.lt1 small{display:block;color:var(--muted);font-size:13px}
.lt2{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
.lvac{color:var(--muted);font-size:14px;padding:4px 12px 8px}
.lnota{color:var(--muted);font-size:12.5px;padding:12px 10px 4px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead h2{font-family:var(--display);font-size:32px;margin:0;line-height:1.1}

.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:140px;min-width:0}
.khead{font-weight:700;color:var(--brand);text-transform:uppercase;font-size:13px;letter-spacing:.06em;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kgrid .card{margin:0}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filtros input,.filtros select{width:auto;font-size:15px;padding:7px 9px}
.tblw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--brand);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}

async function api(accion,datos={}){
  if(!S.api) throw new Error("Falta configurar la dirección del servidor");
  let r;
  try{
    r=await fetch(S.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({accion,pin:S.pin,...datos})});
  }catch(e){throw new Error("Sin conexión con el servidor. Comprueba la cobertura e inténtalo otra vez.")}
  let j; try{j=await r.json()}catch(e){throw new Error("El servidor no responde bien (¿está publicada la última versión del script?)")}
  if(!j.ok){ if(j.pin){S.pin="";S.user=null;S.rol=null;S.scr=null;LS.del("ped_pin");} throw new Error(j.error||"Error del servidor"); }
  return j;
}

async function cargar(silencioso){
  try{
    const j=await api("datos");
    S.user=j.usuario;S.rol=j.rol;S.productos=j.productos;S.pedidos=j.pedidos;S.albaranes=j.albaranes||[];S.ult=new Date();
    LS.set("ped_cache_prod",S.productos);
    const escribiendo=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!silencioso||(!S.scr&&S.tab!=="precios"&&S.tab!=="autoventa"&&!escribiendo)) render(); else {renderHeader();marcoDesk();}

}

const prod=c=>S.productos.find(p=>p.c===c);
const activos=()=>S.productos.filter(p=>p.activo!==false);
const grupoDe=c=>(prod(c)||{}).g||"X";
const base=g=>String(g||"X").charAt(0);
const colorG=g=>(GRUPOS[base(g)]||GRUPOS.X)[1];
const pmDe=c=>num((prod(c)||{}).pm);
const kgEst=l=>Math.round(num(l.pzS??l.pz)*pmDe(l.c)*1000)/1000;
const nomDe=(c,n)=>String(n||(prod(c)||{}).n||c||"");
const esPorc=g=>/^[MODC]P$/.test(g||"");
const udB=(g,n)=>esPorc(g)?(n===1?"bolsa":"bolsas"):"band.";
const bandTxt=(pz,b,g)=>b>1&&pz>=b?(pz%b===0?`${pz/b} ${udB(g,pz/b)}`:`${Math.floor(pz/b)} ${udB(g,Math.floor(pz/b))} + ${pz%b} pz`):"";
const tintG=g=>colorG(g)+"-t";
const estiloG=g=>`--c:var(${colorG(g)});--t:var(${tintG(g)})`;
// Porciones: se marcan en «Especie» como «Porción mezcla/oveja/D.O./cabra» (MP, OP, DP, CP).
// Mientras no haya ninguna marcada así, se deducen por la 3ª letra P del código.
const OPC_G=[["X","Sin sal / requesón"],["M","Mezcla"],["O","Oveja"],["D","Manchego D.O."],["C","Cabra"],["MP","Porción mezcla"],["OP","Porción oveja"],["DP","Porción D.O."],["CP","Porción cabra"],["V","Avería"]];
const hayPorcionMarcada=l=>(l||S.productos).some(p=>/^[MODC]P$/.test(p.g));
const pareceporcion=p=>"MODC".includes(base(p.g))&&String(p.g).length===1&&String(p.c||"").replace(/\s+/g,"").charAt(2)==="P";
const esPorcion=(p,l)=>/^[MODC]P$/.test(p.g)||(!hayPorcionMarcada(l)&&pareceporcion(p));
const seccion=(p,l)=>p.g==="V"?"V":esPorcion(p,l)?"P":(GRUPOS[base(p.g)]?base(p.g):"X");
const SECC_I=Object.fromEntries(SECC.map((x,i)=>[x[0],i]));
const seccTit=k=>(SECC.find(x=>x[0]===k)||SECC[0])[1];
const cabSecc=k=>`<div class="grupo s-${k}">${seccTit(k)}</div>`;
function rangos(lista){const m={};lista.map((p,i)=>({p,i})).sort((a,b)=>SECC_I[seccion(a.p,lista)]-SECC_I[seccion(b.p,lista)]||a.i-b.i).forEach((x,k)=>{m[x.p.c]=k});return m}
function ordenProds(lista){const m=rangos(lista);return lista.slice().sort((a,b)=>m[a.c]-m[b.c])}
function ordenLineas(ls){const m=rangos(S.productos);return ls.slice().sort((a,b)=>(m[a.c]??1e4)-(m[b.c]??1e4))}

/* =================== tarjetas de pedido =================== */
function totPz(p){return p.lineas.reduce((s,l)=>s+(l.pzS??l.pz),0)}
// Fecha legible: «Hoy · Domingo 4 oct», «Ayer · …», «Jueves 2 oct»
function fDiaPed(iso){const d=new Date(iso);if(isNaN(d))return"";const h=new Date();h.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const dif=Math.round((h-x)/864e5),t=d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"}).replace(",","").replace(".","");
  return (dif===0?"Hoy · ":dif===1?"Ayer · ":"")+t.charAt(0).toUpperCase()+t.slice(1)}
const fHora=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})};
const difsDe=p=>["ENVIADO","ANULADO"].includes(p.estado)?[]:p.lineas.filter(l=>l.extra||(l.pzS!=null&&+l.pzS!==+l.pz));
function tarjeta(p,sel){
  const nl=p.lineas.length, pz=totPz(p);
  if(S.rol==="TIENDA"){const nd=difsDe(p).length;
    return `<div class="card ped" data-ver="${esc(p.id)}"><span></span>
    <b>${fDiaPed(p.creado)}</b><span class="chip e-${p.estado}">${EST_TXT[p.estado]||p.estado}</span>
    <div class="meta">${fHora(p.creado)} · Pedido ${esc(p.id)} · ${nl} producto${nl===1?"":"s"} · ${pz} pz${nd?` · <b style="color:var(--warn);font-size:inherit;display:inline">${nd} diferencia${nd>1?"s":""}</b>`:""}${p.obs?" · 📝":""}</div></div>`}
  return `<div class="card ped" data-ver="${esc(p.id)}">
    ${sel?`<input type="checkbox" class="selbox" data-sel="${esc(p.id)}" ${S.sel.has(p.id)?"checked":""} aria-label="Seleccionar pedido ${esc(p.id)}">`:`<span></span>`}
    <b>${fDiaPed(p.creado)}</b><span class="chip e-${p.estado}">${EST_TXT[p.estado]||p.estado}</span>
    <div class="meta">${fHora(p.creado)} · Pedido ${esc(p.id)} · ${esc(p.creadoPor)} · ${nl} producto${nl===1?"":"s"} · ${pz} pz${p.albaran?` · Albarán ${esc(p.albaran)}`:""}</div>${p.obs&&["ENVIADO","PREPARANDO"].includes(p.estado)?`<div class="obsChip">⚠ Lleva observaciones de la tienda</div>`:""}
  </div>`;
}

/* =================== dictado por voz en las observaciones =================== */
let dictando=null;
document.addEventListener("click",e=>{const b=e.target.closest("[data-dictar]");if(!b)return;e.preventDefault();e.stopPropagation();
  const ta=document.getElementById(b.dataset.dictar);if(!ta)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast("Este móvil no permite dictar aquí. Usa el micrófono del teclado 🎤",true);
  if(dictando){dictando.stop();return}
  const r=new SR();r.lang="es-ES";r.interimResults=false;r.continuous=false;
  const base=ta.value;dictando=r;b.classList.add("on");b.textContent="● Escuchando… (pulsa para parar)";
  r.onresult=ev=>{let t="";for(const x of ev.results)t+=x[0].transcript;t=t.trim();if(!t)return;
    ta.value=(base&&!/\s$/.test(base)?base+" ":base)+t.charAt(0).toUpperCase()+t.slice(1);ta.dispatchEvent(new Event("input",{bubbles:true}))};
  r.onerror=ev=>{if(ev.error==="not-allowed")toast("Da permiso al micrófono para poder dictar",true);else if(ev.error!=="no-speech"&&ev.error!=="aborted")toast("No se pudo dictar ("+ev.error+")",true)};
  r.onend=()=>{dictando=null;b.classList.remove("on");b.textContent="🎤 Dictar"};
  try{r.start()}catch(err){dictando=null;b.classList.remove("on");b.textContent="🎤 Dictar"}
},true);

  const vacio=!todos.length?"Todavía no hay pedidos preparados"+(desk?" en estas fechas.":". Cuando la fábrica prepare un pedido, aparecerá aquí comparado con lo que se pidió.")
    :F==="dif"?"Ninguna diferencia: todo lo enviado coincide con lo pedido.":"Ningún pedido en este apartado.";
  app.innerHTML=`<div class="wrap" style="${desk?"max-width:1000px":""}">
    ${desk?filtroFechas():""}
    <div class="sumf">

function vHist(app){
  const sc=S.scr,p=pedDe(sc.id);if(!p){S.scr=null;return render()}
  barra("");
  const volver=()=>{S.scr=sc.vuelve;render();scrollTo(0,0)};
  if(!sc.h){
    app.innerHTML=`<div class="wrap" style="max-width:900px"><div class="acc" style="margin-bottom:10px"><button class="btn sm" id="bVolver">← Volver</button></div><div class="vacio">${sc.err?esc(sc.err):"Buscando el pedido original…"}</div></div>`;
    $("#bVolver").onclick=volver;
    if(!sc.err&&!sc.cargando){sc.cargando=true;api("historialPedido",{id:p.id}).then(j=>{sc.h=j.historial||[];if(S.scr===sc)render()})
      .catch(e=>{sc.err=/desconocida/i.test(e.message)?"Falta pegar en Apps Script el Codigo.gs nuevo para poder ver los cambios.":e.message;sc.cargando=false;if(S.scr===sc)render()})}
    return}
  const H=sc.h, mapa=ls=>{const m=new Map();ls.forEach(l=>m.set(l.c,(m.get(l.c)||0)+(+l.pz||0)));return m};
  const actual=mapa(p.lineas.filter(l=>!l.extra));
  const orig=H.length?mapa(H[0].lineas):null;
  const nom=c=>esc(nomDe(c));
  const cambios=(a,b)=>{const r=[];new Set([...a.keys(),...b.keys()]).forEach(c=>{const x=a.get(c)||0,y=b.get(c)||0;
      if(x===y)return;if(!y)r.push(`<span class="hq">Quitó ${x} ${nom(c)}</span>`);else if(!x)r.push(`<span class="ha">Añadió ${y} ${nom(c)}</span>`);else r.push(`<span class="hc">${nom(c)}: ${x} → ${y}</span>`)});return r};
  const pasos=H.slice(1).map((v,i)=>{const prev=H[i],r=cambios(mapa(prev.lineas),mapa(v.lineas));
      if(v.obs!==null&&prev.obs!==null&&v.obs!==prev.obs)r.push(`<span class="hc">Cambió las observaciones</span>`);
      return `<div class="hpaso"><b>${fCorta(v.fecha)} · ${esc(v.usuario)}</b><div>${r.join("")||`<span class="muted">Guardó sin cambiar artículos</span>`}</div></div>`}).join("");
  let cuerpo;
  if(!orig) cuerpo=`<div class="vacio">No encuentro en el registro cómo se hizo este pedido.</div>`;
  else{const cods=[...new Set([...orig.keys(),...actual.keys()])];
    const filas=cods.map(c=>{const o=orig.get(c)||0,a=actual.get(c)||0,k=o===a?"ok":!a?"no":!o?"mas":"no",
        t=o===a?"":!a?"Quitado":!o?"Añadido":a<o?`${o-a} menos`:`${a-o} más`;
      return `<div class="cmpr ${k}"><span class="cmpa"><i class="dot" style="${estiloG(grupoDe(c))}"></i><b>${nom(c)}</b>${t?`<em>${t}</em>`:""}</span><span class="n">${o||"—"}</span><span class="n"><b>${a||"—"}</b></span><span class="ico ${k==="ok"?"si":"no"}">${k==="ok"?"✓":"✗"}</span></div>`}).join("");
    const sum=m=>[...m.values()].reduce((x,y)=>x+y,0), o0=H[0];
    cuerpo=`<div class="card cmpc"><div class="cmp hcmp"><div class="cmph"><span>Artículo</span><span>Original</span><span>Ahora</span><span></span></div>${filas}
      <div class="cmpr tot"><span class="cmpa"><b>Total piezas</b></span><span class="n"><b>${sum(orig)}</b></span><span class="n"><b>${sum(actual)}</b></span><span></span></div></div></div>
      ${o0.obs!==null&&o0.obs!==(p.obs||"")?`<div class="obsbox"><b>Observaciones originales:</b> ${esc(o0.obs)}</div>`:""}
      <div class="sec">Cambios</div><div class="card">${pasos||`<span class="muted">No se ha modificado lo pedido.</span>`}</div>`}
  app.innerHTML=`<div class="wrap" style="max-width:900px">
    <div class="acc" style="margin-bottom:10px"><button class="btn sm" id="bVolver">← Volver</button></div>
    <div class="card"><b style="font-family:var(--display);font-size:22px">${fDiaPed(p.creado)}</b><div class="muted">Pedido ${esc(p.id)} · original: ${H.length?`${fCorta(H[0].fecha)} por ${esc(H[0].usuario)}`:"—"}</div></div>
    ${cuerpo}</div>`;
  $("#bVolver").onclick=volver;
}

function guardarBorrador(){ if(S.scr&&S.scr.t==="editar"&&!S.scr.ped.id){S.borr=S.scr.ped;LS.set("ped_borrador",S.borr)} }
function vEditar(app){
  const P=S.scr.ped, q=(S.scr.q||"").trim().toUpperCase();
  const cant=c=>(P.lineas.find(l=>l.c===c)||{}).pz||0;
  const lista=ordenProds(activos().filter(p=>!q||p.c.toUpperCase().includes(q)||p.n.toUpperCase().includes(q)));
  let h="",gAnt=null;
  for(const p of lista){

    </div>`;

  app.innerHTML=`<div class="wrap">

  </div>`;
  const pz=P.lineas.reduce((s,l)=>s+l.pz,0);
  barra(`<div class="tot"><small>${P.lineas.length} productos</small>${pz} piezas</div><button class="btn pri" id="bEnv" ${P.lineas.length?"":"disabled"}>${editando?"Guardar cambios":"Enviar pedido"}</button>`);

  const setQ=(c,n)=>{n=Math.max(0,Math.round(n));const i=P.lineas.findIndex(l=>l.c===c);const pr=prod(c);
    if(n===0){if(i>=0)P.lineas.splice(i,1)} else if(i>=0)P.lineas[i].pz=n; else P.lineas.push({c,n:pr.n,pz:n,p:pr.p});

  app.onclick=e=>{const t=e.target;

    else if(t.dataset.m){setQ(t.dataset.m,cant(t.dataset.m)-1);render()}
    else if(t.dataset.bp){const pr=prod(t.dataset.bp);setQ(pr.c,cant(pr.c)+pr.b);render()}
  };
  app.querySelectorAll("[data-q]").forEach(i=>i.onchange=()=>{setQ(i.dataset.q,num(i.value));render()});

  };

function vHistorial(app){

/* =================== AUTOVENTA: cuadre físico de los camiones (solo ADMIN) =================== */
// Lleva = lo que dejó el cuadre anterior (+ lo que cargó entre medias). Vendidos = Lleva − Descarga. Sale = Descarga + Carga.
// Los artículos son los del catálogo común; en «Artículos de autoventa» se marca cuáles salen en la hoja del camión.
// Aceite grande y minis se cuadran también por peso: se apunta cada caja o bandeja y se resta la tara si toca.
const AV_PZCAJA={grande:2,mini:null}; // piezas por pesada (en minis las bandejas no van completas: sin control)
const AV_PNOM={grande:"Aceite grande",mini:"Aceite minis"}, AV_TOL=100; // tolerancia de peso en gramos
// Lo que llevaba Miguel Ángel al salir según la hoja en papel del viernes 2/10/2026 (ayuda para el «Lleva» del primer cuadre)
const AV_PAPEL={vend:"Miguel Ángel",fecha:"2026-10-02",kg:{grande:53.2,mini:52.3},pz:[["ACEITE GRANDE",17],["ACEITE MEDIANO",8],["ACEITE MINI",55],["ACEITE CUÑA",72],["ACEITE TARRO 1 O.",19],["OVEJA CURADO 3K",17],["OVEJA CURADO 2K",23],["OVEJA CURADO 1K",18],["OVEJA SEMI 3K",19],["OVEJA SEMI 2K",10],["OVEJA SEMI 1K",47],["OVEJA SEMI CUÑA",76],["TIERNO 3K",3],["BARRA",24],["AMARILLO",9],["CURADO MEZCLA",5],["OVEJA TIERNO 3K",11],["OVEJA TIERNO 2K",10],["OVEJA TIERNO 1K",28],["OVEJA TIERNO CUÑA",61],["D.O. 3K",1],["OVEJA ACEITE 2K",8],["OVEJA ACEITE 1K",52]]};

const avN=v=>v===null||v===undefined||v===""?null:(isFinite(+v)?+v:null);
const avP=s=>{s=String(s??"").trim().replace(/\s/g,"").replace(",",".");if(s==="")return null;const n=Number(s);return isFinite(n)?n:null};
const avR3=x=>Math.round((x+1e-9)*1000)/1000;
const avF=x=>x===null||x===undefined||isNaN(x)?"":String(avR3(x)).replace(".",",");
const avKg=x=>x===null||x===undefined||isNaN(x)?"—":x.toLocaleString("es-ES",{useGrouping:false,minimumFractionDigits:1,maximumFractionDigits:3});
const avDia=iso=>{if(!iso)return"";const d=new Date(iso+"T12:00:00");return isNaN(d)?iso:d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"short"})};
const avDiaC=iso=>{if(!iso)return"";const d=new Date(iso+"T12:00:00");return isNaN(d)?iso:d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"numeric",year:"2-digit"})};

S.av={cargado:false,cargando:false,cuadres:LS.get("av_cache",{}),config:LS.get("av_cfg",null),pend:LS.get("av_pend",{}),
  vend:LS.get("av_vend",""),cur:null,fase:"desc",todas:false,borrar:false,nuevoVend:false,quitarV:null,quitarC:null,ordSel:null,arts:false,fv:"",fd:"",fh:""};
function avCfg(){const c=S.av.config||(S.av.config={});c.vendedores=c.vendedores||["Miguel Ángel","Mere"];const iM=c.vendedores.indexOf("Mary");if(iM>=0&&!Object.values(S.av.cuadres).some(x=>x.vendedor==="Mary"))c.vendedores[iM]="Mere";c.taras=c.taras||{grande:0,mini:2.6};
  c.arts=c.arts||[];c.peso=c.peso||{grande:"",mini:""};return c}

/* ---- cálculo ---- */
const avLin=(c,k)=>(c&&c.lineas&&c.lineas[k])||{};
function avCalc(l){
  const lleva=(avN(l.ll)||0)+(avN(l.en)||0), de=avN(l.de), al=avN(l.al), ca=avN(l.ca)||0;
  const vend=de===null?null:lleva-de, dif=vend===null||al===null?null:al-vend;
  const base=de===null?(lleva===0?0:null):de;
  return {lleva,de,vend,al,dif,ca,sale:base===null?null:base+ca,usada:lleva>0||de!==null||ca!==0||al!==null};
}
// referencias de la hoja: marcadas para autoventa (orden del catálogo) + las que ya tenga el cuadre
function avRefs(c,todas){
  const en=new Set(avCfg().arts), usa=Object.keys((c&&c.lineas)||{}).filter(k=>avCalc(c.lineas[k]).usada);
  avOrdenInicial();
  const l=avCfg().arts.slice();
  ordenProds(S.productos).map(p=>p.c).forEach(k=>{if(!l.includes(k)&&(todas||usa.includes(k)))l.push(k)});
  usa.forEach(k=>{if(!l.includes(k))l.push(k)}); return l;
}

// Orden de la hoja de cuadre: el de cf.arts. La primera vez se ordena como la hoja de papel (AV_PAPEL).
const avNorm=t=>String(t||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/KG\b/g,"K").replace(/[^A-Z0-9Ñ]/g,"");
function avPapelIdx(p){const n=avNorm(p.n),c=avNorm(p.c);return AV_PAPEL.pz.findIndex(([x])=>{const k=avNorm(x);return k===n||k===c})}
function avOrdenInicial(){const cf=avCfg();if(cf.ordenHoja||!S.av.cargado||!cf.arts.length)return;
  const pos=c=>{const p=prod(c);const i=p?avPapelIdx(p):-1;return i<0?1000:i}, cat=rangos(S.productos);
  cf.arts.sort((a,b)=>pos(a)-pos(b)||(cat[a]??1e4)-(cat[b]??1e4));cf.ordenHoja=true;avGuardarCfg()}
const avPeso0=()=>({llevaKg:null,entre:[],desc:[],albKg:null,carga:[]});
function avPeso(c,b){
  const p=(c.pesos&&c.pesos[b])||avPeso0(), tara=avN(p.tara??avCfg().taras[b])||0;
  const suma=arr=>{let br=0,t=0;(arr||[]).forEach(e=>{br+=avN(e.kg)||0;if(e.t)t+=tara});return {bruto:avR3(br),taras:avR3(t),neto:avR3(br-t),n:(arr||[]).length}};
  const entreKg=avR3((p.entre||[]).reduce((a,e)=>a+(avN(e.kg)||0),0)), lleva=avN(p.llevaKg);
  const total=lleva===null&&!entreKg?null:avR3((lleva||0)+entreKg);
  const d=suma(p.desc), cg=suma(p.carga), vend=total===null||!d.n?null:avR3(total-d.neto), alb=avN(p.albKg);
  return {p,tara,total,d,cg,vend,alb,difG:vend===null||alb===null?null:Math.round((alb-vend)*1000),sale:d.n||cg.n?avR3(d.neto+cg.neto):null};
}
function avTot(c){
  const t={lleva:0,ll:0,en:0,de:0,vend:0,ca:0,sale:0,pend:0,mal:0,ok:0,difs:[]};
  avRefs(c).forEach(k=>{const l0=avLin(c,k),x=avCalc(l0);t.lleva+=x.lleva;t.ll+=avN(l0.ll)||0;t.en+=avN(l0.en)||0;if(x.de!==null)t.de+=x.de;if(x.vend!==null)t.vend+=x.vend;t.ca+=x.ca;if(x.sale!==null)t.sale+=x.sale;
    if(x.vend){if(x.al===null)t.pend++;else if(x.dif===0)t.ok++;else{t.mal++;t.difs.push([k,x.dif])}}});
  return t;
}
const avDifTxt=g=>g===null?"pendiente":g===0?"exacto":g>0?`sobran ${g} g`:`faltan ${-g} g`;
const avDifCls=g=>g===null?"av-neu":Math.abs(g)<=AV_TOL?"av-ok":"av-mal";
function avMal(c){return avTot(c).mal+["grande","mini"].filter(b=>{const g=avPeso(c,b).difG;return g!==null&&Math.abs(g)>AV_TOL}).length}

/* ---- servidor y guardado (se guarda solo; si no hay cobertura se reintenta) ---- */
async function avCargar(){
  if(S.av.cargando)return; S.av.cargando=true;
  try{
    const j=await api("avDatos"), m={};
    (j.cuadres||[]).forEach(x=>{m[x.id]=x.datos});
    Object.keys(S.av.pend).forEach(id=>{ if(S.av.pend[id]==="borrar") delete m[id]; else if(S.av.cuadres[id]) m[id]=S.av.cuadres[id]; });
    S.av.cuadres=m; if(j.config&&!S.av.pend.CONFIG)S.av.config=j.config; S.av.cargado=true;
    LS.set("av_cache",m); LS.set("av_cfg",S.av.config);
    avSubir();
  }catch(e){toast(/desconocida/i.test(e.message)?"Falta instalar Autoventa.gs en el servidor":e.message,true)}
  S.av.cargando=false;
  if(S.tab==="autoventa"&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
}
let avT=null, avSubiendo=false;
function avTocar(id){
  id=id||S.av.cur; if(!id)return;
  if(S.av.pend[id]!=="borrar") S.av.pend[id]=1;
  LS.set("av_pend",S.av.pend); LS.set("av_cache",S.av.cuadres); LS.set("av_cfg",S.av.config);
  avEstado("Guardando…"); clearTimeout(avT); avT=setTimeout(avSubir,900);
}
async function avSubir(){
  if(avSubiendo){clearTimeout(avT);avT=setTimeout(avSubir,700);return}
  const ids=Object.keys(S.av.pend); if(!ids.length){avEstado("Guardado en la hoja");return}
  avSubiendo=true;
  try{
    for(const id of ids){
      const marca=S.av.pend[id], body=marca==="borrar"?null:id==="CONFIG"?clone(avCfg()):S.av.cuadres[id]?clone(S.av.cuadres[id]):null;
      if(marca==="borrar") await api("avBorrar",{id}); else if(body) await api("avGuardar",{id,datos:body});
      if(S.av.pend[id]===marca) delete S.av.pend[id];
    }
    LS.set("av_pend",S.av.pend); avEstado(Object.keys(S.av.pend).length?"Guardando…":"Guardado en la hoja");
  }catch(e){avEstado("Sin conexión · se guardará al volver la cobertura")}
  avSubiendo=false;
  if(Object.keys(S.av.pend).length){clearTimeout(avT);avT=setTimeout(avSubir,15000)}
}
function avEstado(t){const e=$("#avSt");if(e){e.textContent=t;e.classList.toggle("av-pend",!/Guardado/.test(t))}}
function avGuardarCfg(){avTocar("CONFIG")}
// Bandejas: las que trae (desc) y las que hay al terminar de cargar (total); cargadas = diferencia
function avBj(c){const bj=c.bandejas||{},d=avN(bj.desc),t=avN(bj.total)??(avN(bj.carga)!==null?(d||0)+avN(bj.carga):null);return {d,t,ca:t===null||d===null?null:t-d}}
// Kilos aproximados de lo que sale: piezas × peso medio; el aceite pesado con su peso real
function avKgSale(c){const cf=avCfg();let kg=0;const pes={};["grande","mini"].forEach(b=>{if(cf.peso[b])pes[cf.peso[b]]=avPeso(c,b).sale});
  avRefs(c).forEach(k=>{const x=avCalc(avLin(c,k));if(!x.sale)return;kg+=pes[k]!=null?pes[k]:x.sale*pmDe(k)});return Math.round(kg)}
function avCtl(c){const ct=c.control||{},cf=avCfg(),bj=avBj(c);
  return {fecha:ct.fecha||c.cierre||hoy(),trans:c.vendedor,mat:ct.mat??((cf.matriculas||{})[c.vendedor]||""),bultos:ct.bultos??bj.t,kilos:ct.kilos??avKgSale(c),temp:ct.temp??null,conf:ct.conf!==false,obs:ct.obs||""}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&Object.keys(S.av.pend).length&&S.pin)avSubir()});
window.addEventListener("online",()=>{if(Object.keys(S.av.pend).length&&S.pin)avSubir()});

/* ---- cuadres ---- */
const avDiaV=iso=>{if(!iso)return"";const d=new Date(iso+"T12:00:00");return isNaN(d)?iso:d.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"numeric"})};
// viaje: desde el cuadre anterior del mismo vendedor (día que salió cargado) hasta este (día que vuelve y se cuadra)
// Un cuadre es un viaje: empieza el día de su fecha (sale cargado) y termina el día que se cuadra y se cierra.
function avHasta(c){if(c.estado!=="cerrado")return null;if(c.cierre)return c.cierre;let r=null;Object.values(S.av.cuadres).forEach(x=>{if(x!==c&&x.vendedor===c.vendedor&&x.fecha&&c.fecha&&x.fecha>c.fecha&&(!r||x.fecha<r))r=x.fecha});return r}
function avViaje(c){const h=avHasta(c);return `${avDiaV(c.fecha)} → ${h?avDiaV(h):c.estado==="cerrado"?"?":"en ruta"}`}
// Al cerrar un viaje, el siguiente empieza con lo que descargó y lo que cargó ese día
function avBase(a,c){c.lineas=c.lineas||{};avRefs(a).forEach(k=>{const x=avCalc(avLin(a,k));if(!x.sale){if(c.lineas[k]){delete c.lineas[k].ll;delete c.lineas[k].en}return}
    const l=c.lineas[k]||(c.lineas[k]={});const ll=x.sale-(x.ca||0);if(ll)l.ll=ll;else delete l.ll;if(x.ca)l.en=x.ca;else delete l.en});
  c.pesos=c.pesos||{grande:avPeso0(),mini:avPeso0()};["grande","mini"].forEach(b=>{const w=avPeso(a,b);c.pesos[b]=c.pesos[b]||avPeso0();c.pesos[b].llevaKg=w.sale;if(w.p.tara!=null)c.pesos[b].tara=w.p.tara});
  const tb=avBj(a).t;c.bandejas=c.bandejas||{};if(tb)c.bandejas.lleva=tb}
const avLista=v=>Object.entries(S.av.cuadres).filter(([,c])=>!v||c.vendedor===v).sort((a,b)=>(b[1].fecha||"").localeCompare(a[1].fecha||"")||(b[1].creado||0)-(a[1].creado||0));
const avUltCerrado=v=>avLista(v).find(([,c])=>c.estado==="cerrado");
const avAbierto=v=>avLista(v).find(([,c])=>c.estado!=="cerrado");
function avNuevo(v){
  if(!S.av.cargado)return toast("Espera a que se lean los cuadres de la hoja",true);
  const yaAb=avAbierto(v);if(yaAb){toast(v+" ya tiene un cuadre abierto: se abre ese");return avAbrir(yaAb[0])}
  const ant=avUltCerrado(v), c={vendedor:v,fecha:hoy(),estado:"abierto",creado:Date.now(),lineas:{},pesos:{grande:avPeso0(),mini:avPeso0()},bandejas:{},nota:""};
  if(ant){avBase(ant[1],c);c.origen=ant[0]}
  else c.primero=true;
  const id="c"+Date.now().toString(36);
  S.av.cuadres[id]=c; avAbrir(id); avTocar(id);
}
function avAbrir(id){const c=S.av.cuadres[id];S.av.cur=id;S.av.fase=c&&c.estado==="cerrado"?"hoja":"desc";S.av.todas=false;S.av.borrar=false;S.av.arts=false;render();scrollTo(0,0)}
function avRefTxt(k){const p=prod(k);return `<span class="dot" style="${p?estiloG(p.g):"--c:var(--otros)"}"></span><b>${esc(nomDe(k))}</b>`}

  const filas=avRefs(c).filter(k=>avCalc(avLin(c,k)).usada).map(k=>{const x=avCalc(avLin(c,k)),d=x.al===null?"":x.dif===0?"✓":(x.dif>0?"+":"")+x.dif;
    return `<tr><td><b>${esc(nomDe(k))}</b></td><td class="n">${x.lleva}</td><td class="n">${x.de??""}</td><td class="n"><b>${x.vend??""}</b></td><td class="n">${d}</td><td class="n">${x.ca||""}</td><td class="n"><b>${x.sale??""}</b></td></tr>`}).join("");
  const pes=(n,w)=>`<tr><td>${n}</td><td class="n">${avKg(w.total)}</td><td class="n">${w.d.n?avKg(w.d.neto):""}</td><td class="n"><b>${avKg(w.vend)}</b></td><td class="n">${avKg(w.alb)}</td><td class="n">${w.difG===null?"":(w.difG>0?"+":"")+w.difG+" g"}</td><td class="n"><b>${avKg(w.sale)}</b></td></tr>`;
  $("#imp").innerHTML=`<section class="copia">${cabecera("CUADRE AUTOVENTA","",esc(c.vendedor)+" · viaje "+avViaje(c))}
    <table><thead><tr><th>Artículo</th><th>Llevaba</th><th>Descarga</th><th>Vendidos</th><th>Albarán</th><th>Carga</th><th>Sale con</th></tr></thead><tbody>${filas}</tbody>
    <tfoot><tr><td>TOTAL</td><td class="n">${t.lleva}</td><td class="n">${t.de}</td><td class="n">${t.vend}</td><td></td><td class="n">${t.ca}</td><td class="n">${t.sale}</td></tr></tfoot></table>
    <table style="margin-top:4mm"><thead><tr><th>Peso (kg)</th><th>Llevaba</th><th>Descarga</th><th>Vendido</th><th>Albarán</th><th>Dif.</th><th>Sale con</th></tr></thead><tbody>${pes("Aceite grande",g)}${pes("Minis",m)}</tbody></table>
    ${c.nota?`<div class="pobs"><b>Notas:</b> ${esc(c.nota)}</div>`:""}</section>`;
  imprimir("A4 portrait","10mm");
}

/* =================== arranque =================== */
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
